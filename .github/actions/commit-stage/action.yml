name: commit-stage
description: Build, fast checks, and optional matched Preview root smoke.
inputs:
  preview:
    description: Require the PR Preview evidence and root HTTP smoke.
    default: 'false'
  source-sha:
    description: PR source head deployed by Cloudflare.
  source-branch:
    description: PR source branch recorded by the deployment recorder.
outputs:
  preview-url:
    description: The matched Preview URL.
    value: ${{ steps.preview.outputs.url }}
runs:
  using: composite
  steps:
    - name: install Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node-version
        cache: npm
    - name: install dependencies
      shell: bash
      run: npm ci
    - name: check
      shell: bash
      run: npm run check
    - name: build
      shell: bash
      run: npm run build
    - name: fast tests
      shell: bash
      run: npm run test:unit
    - name: Preview selection tests
      shell: bash
      run: npm run test:ci
    - name: wait for matched Preview
      id: preview
      if: inputs.preview == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        SOURCE_SHA: ${{ inputs.source-sha }}
        SOURCE_BRANCH: ${{ inputs.source-branch }}
      run: |
        node scripts/ci/preview.mjs "$SOURCE_SHA" "$SOURCE_BRANCH" > preview-evidence.json
        cat preview-evidence.json
        jq -er '"url=" + .previewUrl' preview-evidence.json >> "$GITHUB_OUTPUT"
    - name: root HTTP smoke
      if: inputs.preview == 'true'
      shell: bash
      env:
        PREVIEW_URL: ${{ steps.preview.outputs.url }}
      run: npm run test:smoke -- "$PREVIEW_URL"

