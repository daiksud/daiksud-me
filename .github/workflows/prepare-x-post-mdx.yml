name: prepare-x-post-mdx

on:
  push:
    branches: [feat/adr-recording-article]
    paths: [.github/workflows/prepare-x-post-mdx.yml]

permissions:
  contents: write

jobs:
  prepare:
    if: github.repository == 'daiksud/daiksud-me'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Add MDX and the X post component
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          config = Path('astro.config.ts')
          text = config.read_text()
          assert "import mdx from '@astrojs/mdx';" not in text
          text = text.replace("import { defineConfig } from 'astro/config';", "import mdx from '@astrojs/mdx';\nimport { defineConfig } from 'astro/config';", 1)
          text = text.replace("  trailingSlash: 'never',", "  trailingSlash: 'never',\n  integrations: [mdx()],", 1)
          config.write_text(text)

          config = Path('src/content.config.ts')
          text = config.read_text()
          assert "pattern: '*.md'" in text
          config.write_text(text.replace("pattern: '*.md'", "pattern: '*.{md,mdx}'", 1))

          component = Path('src/components/XPost.astro')
          assert not component.exists()
          component.write_text('''---
          interface Props {
            url: string;
          }

          const { url } = Astro.props;
          ---

          <blockquote class="twitter-tweet" data-lang="ja" data-dnt="true">
            <slot />
            <a href={url} target="_blank" rel="noopener">Xで投稿を見る</a>
          </blockquote>
          <script is:inline async src="https://platform.x.com/widgets.js" charset="utf-8"></script>
          ''')

          article = Path('src/content/posts/how-should-adr-be-recorded.md')
          text = article.read_text()
          start = text.index('> コードには How')
          end_marker = '> — [Takuto Wada (@t_wada), 2017年9月5日](https://x.com/t_wada/status/904916106153828352)'
          end = text.index(end_marker, start) + len(end_marker)
          text = text[:start] + '''<XPost url="https://x.com/t_wada/status/904916106153828352">
            <p lang="ja" dir="ltr">
              コードには How<br />
              テストコードには What<br />
              コミットログには Why<br />
              コードコメントには Why not<br /><br />
              を書こうという話をした
            </p>
            <p>Takuto Wada (@t_wada), 2017年9月5日</p>
          </XPost>''' + text[end:]
          header = re.match(r'\A---\n.*?\n---\n\n', text, re.S)
          assert header
          text = text[:header.end()] + "import XPost from '../../components/XPost.astro';\n\n" + text[header.end():]
          new_article = article.with_suffix('.mdx')
          assert not new_article.exists()
          new_article.write_text(text)
          article.unlink()

          test = Path('tests/content.build.test.mjs')
          test.write_text(test.read_text() + r'''

          it('MDX-01 keeps MDX articles discoverable and quoted X posts readable without the widget', async () => {
            const projectDir = await prepareProject();
            await writeFile(join(projectDir, 'src/content/posts/x-post.mdx'), `---
          title: X post fixture
          description: An article with a quoted X post.
          publishedAt: 2026-01-05
          tags: [fixture-tag]
          ---

          import XPost from '../../components/XPost.astro';

          ## Embedded post

          <XPost url="https://x.com/t_wada/status/904916106153828352">
            <p>Quoted post text.</p>
            <p>Example author, 2026-01-05</p>
          </XPost>

          ## Details

          A note stays available.[^note]

          | Kind | Value |
          | --- | --- |
          | Example | Available |

          [^note]: A footnote stays readable.
          `);
            execFileSync(process.execPath, [astroCli, 'build'], { cwd: projectDir, stdio: 'pipe' });
            const server = await serveBuild(join(projectDir, 'dist'));
            const browser = await chromium.launch();
            try {
              for (const javaScriptEnabled of [false, true]) {
                const context = await browser.newContext({ javaScriptEnabled });
                try {
                  await context.route('https://platform.x.com/widgets.js', (route) => route.abort());
                  const page = await context.newPage();
                  for (const width of [390, 1440]) {
                    await page.setViewportSize({ width, height: 900 });
                    expect((await page.goto(server.url + '/x-post')).status()).toBe(200);
                    expect(await page.getByRole('heading', { level: 1, name: 'X post fixture' }).count()).toBe(1);
                    expect(await page.getByText('Quoted post text.', { exact: true }).isVisible()).toBe(true);
                    expect(await page.getByText('Example author, 2026-01-05', { exact: true }).isVisible()).toBe(true);
                    const source = page.getByRole('link', { name: 'Xで投稿を見る', exact: true });
                    expect(await source.getAttribute('href')).toBe('https://x.com/t_wada/status/904916106153828352');
                    expect(await source.getAttribute('target')).toBe('_blank');
                    expect((await source.getAttribute('rel')).split(/\s+/)).toContain('noopener');
                    expect(await page.getByRole('table').count()).toBe(1);
                    expect(await page.getByText('A footnote stays readable.', { exact: false }).count()).toBeGreaterThan(0);
                    expect(await page.evaluate(() => document.documentElement.scrollWidth <= innerWidth)).toBe(true);
                  }
                  // These attributes and the script URL are the public X embed contract.
                  expect(await page.locator('blockquote.twitter-tweet a').getAttribute('href')).toBe('https://x.com/t_wada/status/904916106153828352');
                  expect(await page.locator('script[src="https://platform.x.com/widgets.js"]').count()).toBe(1);
                  for (const path of ['/', '/posts', '/tags']) {
                    await page.goto(server.url + path);
                    expect(await page.locator('a[href="/x-post"]').count()).toBeGreaterThan(0);
                    expect(await page.locator('script[src="https://platform.x.com/widgets.js"]').count()).toBe(0);
                  }
                  const feed = await parseFeed(page, await readFile(join(projectDir, 'dist/rss.xml'), 'utf8'));
                  expect(feed.items.find((item) => item.guid === 'https://daiksud.me/x-post')?.title).toBe('X post fixture');
                } finally {
                  await context.close();
                }
              }
            } finally {
              await browser.close();
              await server.close();
            }
          }, 60_000);
          ''')

          Path('docs/features/x-posts.feature.md').write_text('''# X posts in MDX articles

          Articles may use `.md` or `.mdx` without changing their extension-free URLs.
          MDX inherits the site's Markdown processor, including footnotes and external-link handling.

          Import `XPost` from `../../components/XPost.astro` in an MDX article. Pass the original
          post URL as `url`, and include the quoted text, author, and date in its children.
          The component emits X's official blockquote and asynchronous `widgets.js` script.
          It does not request oEmbed data during builds or introduce a client framework.
          The script is only emitted on pages that render the component. X availability,
          privacy settings, or content blockers can prevent the enhanced widget from loading;
          the quotation and source link remain readable without it.

          ## MDX-01: Article discovery and readable fallback

          Given an MDX article containing an X post quotation,
          when a reader browses the home page, article list, tag list, or RSS feed,
          then the article is available at the same extension-free URL.

          When JavaScript is disabled or the widget request fails,
          then the quotation, attribution, source link, table, and footnote remain readable,
          and the article fits mobile and desktop viewports.

          The rendered blockquote and script URL follow the external X embed contract.
          Automated tests block the third-party request rather than depend on X availability.

          References:
          - https://docs.x.com/x-for-websites/embedded-posts/overview
          - https://docs.astro.build/en/guides/integrations-guide/mdx/
          ''')
          PY
          pnpm add --save-exact @astrojs/mdx@8.1.6
          pnpm install --frozen-lockfile
          git diff --check
      - name: Check and build
        run: |
          pnpm run check
          pnpm run build
          pnpm run test:unit
          pnpm run test:ci
      - name: Test browser behavior
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm run test:integration
          pnpm run test:acceptance
      - name: Check the live X widget
        run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          import { serveBuild } from './tests/acceptance/server.mjs';
          const server = await serveBuild('dist');
          const browser = await chromium.launch();
          try {
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            await page.goto(server.url + '/how-should-adr-be-recorded');
            try {
              await page.locator('iframe[id^="twitter-widget-"]').waitFor({ state: 'visible', timeout: 25000 });
              console.log('LIVE_X_WIDGET=rendered');
            } catch {
              if (!await page.getByRole('link', { name: 'Xで投稿を見る', exact: true }).isVisible()) {
                throw new Error('Neither the X widget nor its source link is visible');
              }
              console.log('LIVE_X_WIDGET=unavailable; quotation and source link remain visible');
            }
          } finally {
            await browser.close();
            await server.close();
          }
          JS
      - name: Commit validated changes to the existing PR branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'Daiki Sudo'
          git config user.email 'daiksud@proton.me'
          gh auth setup-git
          git add astro.config.ts package.json pnpm-lock.yaml src/content.config.ts src/components/XPost.astro src/content/posts/how-should-adr-be-recorded.md src/content/posts/how-should-adr-be-recorded.mdx tests/content.build.test.mjs docs/features/x-posts.feature.md
          git diff --cached --check
          git commit -m 'feat: render X posts from MDX with an Astro component' -m 'Use the official X widget while keeping quotation text available without JavaScript. Preserve the article URL and the existing Markdown processor, and cover reader behavior in browser integration tests.'
          git push origin HEAD:refs/heads/feat/adr-recording-article
