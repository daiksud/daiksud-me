name: prepare-x-post-mdx

on:
  push:
    branches: [feat/adr-recording-article]
    paths: [.github/workflows/prepare-x-post-mdx.yml]

permissions:
  contents: write

jobs:
  validate:
    if: github.repository == 'daiksud/daiksud-me'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Resolve an eligible official MDX release
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          if (pkg.dependencies['@astrojs/mdx'] !== '8.1.6') throw new Error('Unexpected MDX version');
          const response = await fetch('https://registry.npmjs.org/@astrojs%2Fmdx');
          if (!response.ok) throw new Error('Cannot verify MDX publication time');
          const metadata = await response.json();
          const publishedAt = metadata.time['8.1.5'];
          if (!publishedAt || Date.now() - Date.parse(publishedAt) < 1440 * 60000) {
            throw new Error('MDX 8.1.5 does not meet the existing release-age policy');
          }
          console.log('MDX 8.1.5 published at ' + publishedAt);
          pkg.dependencies['@astrojs/mdx'] = '8.1.5';
          writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          JS
          # Preserve the pre-integration dependency resolutions; add only MDX again.
          git show 79f914a27efadf3f7ec886c05b5d185ab2994ba6:pnpm-lock.yaml > pnpm-lock.yaml
          pnpm install --lockfile-only --no-frozen-lockfile --minimum-release-age-strict
          git diff --exit-code -- pnpm-workspace.yaml
          pnpm install --frozen-lockfile
          git diff --check
      - name: Check and build
        run: |
          pnpm run check
          pnpm run build
          pnpm run test:unit
          pnpm run test:ci
      - name: Test reader behavior
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm run test:integration
          pnpm run test:acceptance
      - name: Check the actual X widget
        run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          import { serveBuild } from './tests/acceptance/server.mjs';
          const server = await serveBuild('dist');
          const browser = await chromium.launch();
          try {
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            await page.goto(server.url + '/how-should-adr-be-recorded');
            await page.locator('iframe[id^="twitter-widget-"]').waitFor({ state: 'visible', timeout: 30000 });
            console.log('LIVE_X_WIDGET=rendered');
          } finally {
            await browser.close();
            await server.close();
          }
          JS
      - name: Commit the validated dependency correction
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'Daiki Sudo'
          git config user.email 'daiksud@proton.me'
          gh auth setup-git
          git diff --exit-code -- pnpm-workspace.yaml
          git add package.json pnpm-lock.yaml
          git diff --cached --check
          git commit -m 'fix: use MDX compatible with the release-age policy' -m 'MDX 8.1.6 was published less than 24 hours ago, so clean frozen installs reject it. Pin the eligible 8.1.5 release instead of weakening supply-chain settings, and regenerate the lockfile from the pre-integration resolutions.'
          git push origin HEAD:refs/heads/feat/adr-recording-article
