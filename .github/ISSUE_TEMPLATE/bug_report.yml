name: 不具合報告
description: サイトの予期しない動作を報告します。
labels: [bug]
body:
  - type: textarea
    id: actual
    attributes:
      label: 発生した問題
      description: 対象のURL、実際の動作と影響を書いてください。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待した動作
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 再現手順
      description: 操作手順と、再現に関係するブラウザ・端末・画面サイズを書いてください。
    validations:
      required: true
